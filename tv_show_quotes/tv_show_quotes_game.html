<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>TV Quote Quiz</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #1e3a2b;
      color: #f3e9d2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      margin: 0;
    }

    #app {
      max-width: 480px;
      width: 100%;
      background: #1e3a2b;
      border-radius: 32px;
      padding: 20px 16px 30px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      border: 1px solid #5a7a4b;
    }

    h1 {
      text-align: center;
      font-weight: 600;
      letter-spacing: 1px;
      font-size: 2rem;
      margin-bottom: 12px;
      color: #f3e9d2;
      border-bottom: 2px dashed #5a7a4b;
      padding-bottom: 10px;
    }

    .mode-toggle {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .mode-btn {
      background: #2b4f3a;
      border: 2px solid #5a7a4b;
      color: #f3e9d2;
      padding: 10px 24px;
      border-radius: 60px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      flex: 1;
      text-align: center;
    }

    .mode-btn.active {
      background: #5a7a4b;
      border-color: #c4b08a;
      color: #f3e9d2;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .mode-btn:active { transform: scale(0.96); }

    .panel {
      background: #1e3a2b;
      border-radius: 24px;
      padding: 16px 12px;
      margin-bottom: 20px;
      border: 1px solid #5a7a4b;
    }

    .players-area {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 10px;
      margin-bottom: 6px;
    }

    .player-tag {
      background: #2b4f3a;
      padding: 6px 16px 6px 14px;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      border: 1px solid #5a7a4b;
    }

    .player-tag .remove-btn {
      background: none;
      border: none;
      color: #d6b68b;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
    }

    .player-tag .remove-btn:active { opacity: 0.6; }

    .add-player-form {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .add-player-form input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 60px;
      border: 1px solid #5a7a4b;
      background: #2b4f3a;
      color: #f3e9d2;
      font-size: 0.95rem;
      min-width: 120px;
    }

    .add-player-form input::placeholder { color: #b8b09a; }

    .add-player-form button {
      background: #5a7a4b;
      border: none;
      color: #f3e9d2;
      padding: 10px 20px;
      border-radius: 60px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      border: 1px solid #7c9a6b;
      transition: 0.1s;
    }

    .add-player-form button:active { background: #4a6e3b; }

    .config-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 8px 0 4px;
    }

    .config-label {
      font-weight: 500;
      font-size: 0.95rem;
    }

    .round-selector {
      display: flex;
      gap: 6px;
      background: #1e3a2b;
      padding: 4px;
      border-radius: 60px;
      border: 1px solid #5a7a4b;
    }

    .round-selector button {
      background: transparent;
      border: none;
      color: #f3e9d2;
      padding: 6px 14px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.1s;
    }

    .round-selector button.active {
      background: #5a7a4b;
      color: #f3e9d2;
    }

    .round-selector button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .show-toggle-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .show-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #2b4f3a;
      padding: 4px 12px 4px 8px;
      border-radius: 40px;
      border: 1px solid #5a7a4b;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
    }

    .show-toggle input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #5a7a4b;
      cursor: pointer;
    }

    .show-toggle.disabled {
      opacity: 0.5;
    }

    .question-box {
      background: #1e3a2b;
      padding: 18px 10px;
      border-radius: 20px;
      border: 1px solid #5a7a4b;
      margin: 16px 0 12px;
    }

    .quote-display {
      font-size: 1.2rem;
      line-height: 1.6;
      padding: 12px 16px;
      background: #2b4f3a;
      border-radius: 40px;
      text-align: center;
      font-style: italic;
      border-left: 6px solid #c4b08a;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .answer-details {
      margin-top: 12px;
      padding: 14px 16px;
      background: #2b4f3a;
      border-radius: 20px;
      border-left: 6px solid #d6b68b;
    }

    .answer-details .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #3a5a4a;
    }

    .answer-details .detail-row:last-child {
      border-bottom: none;
    }

    .answer-details .label {
      font-weight: 600;
      color: #c4b08a;
    }

    .answer-details .value {
      text-align: right;
      margin-left: 12px;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin: 18px 0 6px;
    }

    .action-btn {
      background: #2b4f3a;
      border: 2px solid #5a7a4b;
      color: #f3e9d2;
      padding: 12px 22px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      flex: 1 0 auto;
      transition: 0.1s;
    }

    .action-btn:active { background: #3f664d; }
    .action-btn.reveal { background: #6d4f3a; border-color: #b28b6b; }
    .action-btn.primary { background: #4a6e3b; border-color: #7c9a6b; }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .action-btn.quit { background: #6d3a3a; border-color: #8b4b4b; }

    .competitive-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 12px 0 6px;
    }

    .score-area {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 12px;
      margin: 12px 0 6px;
    }

    .score-badge {
      background: #2b4f3a;
      padding: 4px 14px;
      border-radius: 60px;
      font-size: 0.9rem;
      border: 1px solid #5a7a4b;
    }

    .score-badge span { font-weight: 700; margin-left: 6px; }

    .win-message {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 12px;
      background: #2b4f3a;
      border-radius: 60px;
      margin: 10px 0;
    }

    .footer-note {
      font-size: 0.7rem;
      text-align: center;
      color: #b8b09a;
      margin-top: 16px;
      opacity: 0.8;
    }

    .hidden { display: none; }
    .flex-center { display: flex; justify-content: center; }

    .start-area {
      text-align: center;
      margin: 20px 0 10px;
    }

    .start-btn {
      background: #5a7a4b;
      border: 2px solid #7c9a6b;
      color: #f3e9d2;
      padding: 14px 40px;
      border-radius: 60px;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.1s;
      width: 100%;
    }

    .start-btn:active { background: #4a6e3b; }
    .start-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .question-counter {
      text-align: center;
      font-weight: 500;
      font-size: 1rem;
      background: #2b4f3a;
      padding: 6px 12px;
      border-radius: 60px;
      display: inline-block;
      margin: 0 auto 8px;
      border: 1px solid #5a7a4b;
    }

    .scoring-disabled-note {
      text-align: center;
      font-size: 0.85rem;
      color: #b8b09a;
      margin: 8px 0;
      font-style: italic;
    }

    .quit-area {
      text-align: center;
      margin-top: 12px;
    }

    .quit-btn {
      background: #6d3a3a;
      border: 2px solid #8b4b4b;
      color: #f3e9d2;
      padding: 10px 30px;
      border-radius: 60px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.1s;
    }

    .quit-btn:active { background: #5a2e2e; }
  </style>
</head>
<body>
<div id="app">
  <h1>TV Show Quote Quiz</h1>

  <!-- mode toggle -->
  <div class="mode-toggle">
    <button id="funModeBtn" class="mode-btn active">Fun</button>
    <button id="compModeBtn" class="mode-btn">Competitive</button>
  </div>

  <!-- PLAYER PANEL -->
  <div class="panel" id="configPanel">
    <div id="playersContainer" class="players-area"></div>
    <div class="add-player-form">
      <input type="text" id="playerNameInput" placeholder="Player name" maxlength="20">
      <button id="addPlayerBtn">+ Add</button>
    </div>
  </div>

  <!-- CONFIGURATION -->
  <div class="panel" id="configPanel2">
    <div class="config-row">
      <span class="config-label">Questions:</span>
      <div class="round-selector" id="roundSelector">
        <button data-round="10" class="active">10</button>
        <button data-round="25">25</button>
        <button data-round="0">∞</button>
      </div>
    </div>
    <div class="config-row" style="margin-top: 12px;">
      <span class="config-label">Shows:</span>
    </div>
    <div class="show-toggle-group" id="showToggleGroup">
      <!-- Toggles will be generated from QUOTES data -->
    </div>
  </div>

  <!-- START BUTTON -->
  <div class="start-area" id="startArea">
    <button id="startGameBtn" class="start-btn">▶ Start Game</button>
  </div>

  <!-- FUN MODE UI -->
  <div id="funModePanel" class="hidden">
    <div class="question-box" id="funQuestionBox">
      <div class="quote-display" id="funQuote">—</div>
      <div id="funAnswer" class="answer-details hidden">
        <div class="detail-row"><span class="label">Show:</span><span class="value" id="funShow">—</span></div>
        <div class="detail-row"><span class="label">Character:</span><span class="value" id="funCharacter">—</span></div>
        <div class="detail-row"><span class="label">Episode:</span><span class="value" id="funEpisode">—</span></div>
        <div class="detail-row"><span class="label">Context:</span><span class="value" id="funContext">—</span></div>
      </div>
    </div>
    <div class="action-row">
      <button class="action-btn" id="funNewBtn">New</button>
      <button class="action-btn reveal" id="funRevealBtn">Reveal Answer</button>
    </div>
    <div class="quit-area">
      <button class="quit-btn" id="funQuitBtn">Quit Game</button>
    </div>
  </div>

  <!-- COMPETITIVE MODE UI -->
  <div id="compModePanel" class="hidden">
    <div class="competitive-controls">
      <button class="action-btn" id="compNewQuestionBtn" style="flex:0 1 auto; padding: 6px 18px;">Next Question</button>
    </div>

    <div style="text-align: center;">
      <span id="questionCounter" class="question-counter">Question 0 / 0</span>
    </div>

    <div class="question-box" id="compQuestionBox">
      <div class="quote-display" id="compQuote">—</div>
      <div id="compAnswer" class="answer-details hidden">
        <div class="detail-row"><span class="label">Show:</span><span class="value" id="compShow">—</span></div>
        <div class="detail-row"><span class="label">Character:</span><span class="value" id="compCharacter">—</span></div>
        <div class="detail-row"><span class="label">Episode:</span><span class="value" id="compEpisode">—</span></div>
        <div class="detail-row"><span class="label">Context:</span><span class="value" id="compContext">—</span></div>
      </div>
    </div>

    <div class="action-row">
      <button class="action-btn reveal" id="compRevealBtn">Reveal Answer</button>
    </div>

    <!-- scoring: mark who was correct -->
    <div style="margin: 16px 0 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;">
      <span style="font-weight: 500;">Who got it right?</span>
      <div id="correctMarkers" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
    </div>
    <div id="scoringStatus" class="scoring-disabled-note"></div>

    <div id="scoreDisplay" class="score-area"></div>
    <div id="compGameOver" class="win-message hidden"></div>
    <div class="quit-area">
      <button class="quit-btn" id="compQuitBtn">Quit Game</button>
    </div>
  </div>

  <div class="footer-note">quotes loaded: <span id="quoteCount">0</span></div>
</div>

<script>
  (function() {
    // ---------- QUOTE DATASET (easy to extend) ----------
    const QUOTES = {
      'The Office (US)': [
        { quote: "I think that pretty much sums it up...I found it at Spencer Gifts.", character: "Michael Scott", episode: "S1E1 - Pilot", context: "Michael says this while holding a mug reading 'World's Best Boss.'" },
        { quote: "Uh...nope. Nope. This isn't the surprise. It's surprising because you didn't expect it, but you will...you'll know it when you see it.", character: "Michael Scott", episode: "S1E3 - Health Care", context: "Classic Michael weaseling...and a brilliant cop out." },
        { quote: "Could you mean a vagina? Because if you do, I want that covered.", character: "Meredith Palmer", episode: "S1E3 - Health Care", context: "Kate Flannery's straight-faced delivery here is flawless." },
        { quote: "No, no... 'cause then the ice melts and it's, like, ~second drink~.", character: "Pam Beesly", episode: "S2E1 - The Dundies", context: "'Second drink' could mean so many things. Is it a metaphor for how Pam is acting, after Roy's departure (and maybe the alcohol) thawed her usual caution?" },
        { quote: "I feel God in this Chili's tonight.", character: "Michael Scott", episode: "S2E1 - The Dundies", context: "One of the most quotable lines from the entire series, this is a brilliant and hilarious way to say that you're experiencing a sense of joy you've never felt before." },
        { quote: "Would I rather be feared or loved? Easy. Both. I want people to be afraid of how much they love me.", character: "Michael Scott", episode: "S2E6 - The Fight", context: "Hilarious nonsense, or proof that Michael is really a sociopath?" },
        { quote: "If I had to, I could clean out my desk in five seconds, and nobody would ever know that I'd ever been here. And I'd forget, too.", character: "Ryan Howard", episode: "S2E13 - The Secret", context: "As an older millennial, it's almost embarrassing how often I can relate to Ryan." },
        { quote: "Boy have you done lost your mind, 'cause I'll help you find it!", character: "Stanley Hudson", episode: "S2E18 - Bring Your Daughter To Work Day", context: "Best Stanley line ~EVER~." },
        { quote: "I want you to rub butter on my foot… Pam, please? I have Country Crock.", character: "Michael Scott", episode: "S2E12 - The Injury", context: "What a baby! I love how Pam just bats him away. Oh, also, PSA: don't put butter on a burn." },
        { quote: "Why are you the way that you are?", character: "Michael Scott", episode: "S2E22 - Casino Night", context: "Simple. To the point. Useful in a variety of situations. No notes." },
        { quote: "I love inside jokes. I'd love to be a part of one someday.", character: "Michael Scott", episode: "S3E2 - The Convention", context: "I think this is the best one-liner in the whole series." },
        { quote: "Pam and I would sometimes hum the same high-pitched note and try to get Dwight to make an appointment with an ear doctor. And, uh, Pam called it… pretendinitis.", character: "Jim Halpert", episode: "S3E3 - The Coup", context: "Kind of a mean UwU there, Jim. Brilliant, though." },
        { quote: "I wake up every morning in a bed that's too small, drive my daughter to a school that's too expensive, and then I go to work to a job for which I get paid too little. But on pretzel day? Well, I like pretzel day.", character: "Stanley Hudson", episode: "S3E5 - Initiation", context: "Classic Stanley gripe. It's nice that he drives his daughter to school." },
        { quote: "I am fast. To give you a reference point, I'm somewhere between a snake and a mongoose. And a panther.", character: "Dwight Schrute", episode: "S3E8 - The Merger", context: "Sorry, Dwight — your analogy makes zero sense. However, it's comedy gold, so we'll take it." },
        { quote: "Dwight, you ignorant slut!", character: "Michael Scott", episode: "S3E20 - Safety Training", context: "In case you were wondering when Michael says this all-time classic line, here you go." },
        { quote: "Bears. Beets. Battlestar Gallactica.", character: "Jim Halpert", episode: "S3E21 - Product Recall", context: "Jim obviously loves Dwight (and if it were up to me, I'd have shipped it!)." },
        { quote: "Sometimes the clothes at Gap Kids are too flashy, so I'm forced to go to the American Girl store and order clothes for large colonial dolls.", character: "Angela Martin", episode: "S3E22 - Women's Appreciation", context: "Probably Angela's best one-liner in the whole series." },
        { quote: "I just want to lie on the beach and eat hot dogs. That's all I've ever wanted.", character: "Kevin Malone", episode: "S3E23 - Beach Games", context: "OMG, me too Kevin." },
        { quote: "Guess what, I have flaws. What are they? Oh, I don't know. I sing in the shower. Sometimes I spend too much time volunteering. Occasionally I'll hit somebody with my car. So sue me.", character: "Michael Scott", episode: "S4E1 - Fun Run", context: "I love it when The Office makes real life seem just as absurd as the show." },
        { quote: "Do I need to be liked? Absolutely not. I like to be liked. I enjoy being liked. I have to be liked, but it's not like this compulsive need to be liked, like my need to be praised.", character: "Michael Scott", episode: "S4E1 - Fun Run", context: "This episode has a lot of classic lines." },
        { quote: "I'm not superstitious, but I'm a little stitious.", character: "Michael Scott", episode: "S4E1 - Fun Run", context: "I told you this was an iconic episode. The zingers just keep on coming." },
        { quote: "I've been involved in a number of quotes, both as a leader and a follower. You have more fun as a follower, but you make more money as a leader.", character: "Creed Bratton", episode: "S4E1 - Fun Run", context: "Don't you wish you could watch a spin-off show about Creed's past?" },
        { quote: "I don't hate it. I just don't like it at all and it's terrible.", character: "Michael Scott", episode: "S4E5 - Local Ad", context: "This is Michael at his most Karen...not, like, Rashida Jones's Karen, but the 'I want to speak to the manager' kind." },
        { quote: "I think you're over-thinking it. / I think you're under-thinking it.", character: "Michael Scott / Jim Halpert", episode: "S4E6 - Launch Party", context: "Probably Jim and Michael's G. O. A. T. back-and-forth." },
        { quote: "Darrell Philbin is the most complicated man I've ever met. I mean...who says exactly what they're thinking? What kind of a game is that?", character: "Kelly Kapoor", episode: "S4E8 - Money, Part 2", context: "Classic Kelly." },
        { quote: "Man, Angela really had a hold on him.", character: "Pam Beesly", episode: "S4E8 - Money, Part 2", context: "Said after Dwight plays Bon Jovi's 'You Give Love A Bad Name' on the recorder." },
        { quote: "I am running away from my responsibilities. And it feels good.", character: "Michael Scott", episode: "S4E8 - Money, Part 2", context: "Classic Michael, and probably Steve Carrell's cleverest one-liner ever." },
        { quote: "If I don't have some cake soon, I might die.", character: "Stanley Hudson", episode: "S4E11 - Survivor Man", context: "As someone who seriously can't get enough sweet treats, I felt Stanley's pain on a spiritual level in this moment." },
        { quote: "I don't talk trash, I talk smack. They're totally different. Trash talk is hypothetical, like: 'Your mom is so fat she can eat the internet.' But smack talk is happening like right now. Like: 'You're ugly and I know it for a fact 'cause I got the evidence right there.'", character: "Kelly Kapoor", episode: "S4E12 - The Negotiation", context: "A stunningly brilliant treatise on language." },
        { quote: "I finally broke down and bought myself a plasma TV. Check it out. I actually hung this on the wall myself. I want to show you something: a lot of people in the room, you need more space, viola, right into the wall.", character: "Michael Scott", episode: "S4E13 - Dinner Party", context: "This is my all-time favorite quote, from my favorite The Office episode." },
        { quote: "It's like I used to tell my wife. I do not apologize unless I think I'm wrong, and if you don't like it, you can leave. And I say the same thing to my current wife, and I'll say it to my next one, too.", character: "Stanley Hudson", episode: "S4E16 - Did I Stutter?", context: "A great line from an incredible episode. Leslie David Baker's delivery is what really makes it, though." },
        { quote: "Friends joke with one another: 'Um, you're poor.' 'Well, hey, your mama's dead.' That's what friends do.", character: "Michael Scott", episode: "S4E16 - Did I Stutter?", context: "With friends like Michael Scott, who needs enemies?" },
        { quote: "The real crime, I think, was the beard.", character: "Oscar Martinez", episode: "S4E19 - Goodbye Toby, Part 2", context: "Savage, but true." },
        { quote: "I have a warm blanket and several cozy pillows. I read a chapter of a book and then it's lights out by 8:30. That's how I sleep at night.", character: "Angela Martin", episode: "S5E1 - Weight Loss, Part 1", context: "The second-best Angela quote in the series." },
        { quote: "I wonder what people like about me. Probably my jugs.", character: "Phyllis Vance", episode: "S5E2 - Weight Loss, Part 2", context: "Phyllis Smith (the actor) does deadpan raunchy so well." },
        { quote: "Andy Bernard does not lose contests. He wins them...or he quits because they are unfair.", character: "Andy Bernard", episode: "S5E2 - Weight Loss, Part 2", context: "Oh, Andy." },
        { quote: "Oh, I don't think it's blackmail. Angela just does what I ask her to do, so I won't tell everyone that she's cheating on Andy with Dwight. I think for it to be blackmail, it would have to be a formal letter.", character: "Phyllis Vance", episode: "S5E11 - Moroccan Christmas", context: "Phyllis is probably the only person in The Office who's more manipulative than Michael." },
        { quote: "My philosophy is basically this, and this is something I live by, and always have, and always will. Don't ever, for any reason, do anything to anyone, for any reason, no matter what, no matter where, or who, or who you're with or...or where you are going, or where you have been, ever, for any reason whatsoever.", character: "Michael Scott", episode: "S5E12 - The Duel", context: "Pure poetry." },
        { quote: "Sometimes I'll start a sentence and I don't even know where it's going. I just hope I find it along the way, like an improv conversation....an improversation.", character: "Michael Scott", episode: "S5E12 - The Duel", context: "100% relatable, Michael." },
        { quote: "It's true. Around this office, in the past, I have been a little abrupt with people. But the doctor said, if I can't find a new way to relate more positively to my surroundings, I'm going to die.", character: "Stanley Hudson", episode: "S5E14 - Stress Relief, Part 1", context: "Also, excellent montage. I love Stanley so much." },
        { quote: "And I knew exactly what to do. But in a much more real sense, I had no idea what to do.", character: "Michael Scott", episode: "S5E14 - Stress Relief, Part 1", context: "Do you think Michael ever suffers from Imposter Syndrome?" },
        { quote: "When you're a kid, you assume your parents are soulmates. My kids are going to be right about that.", character: "Pam Beesly", episode: "S5E15 - Stress Relief, Part 2", context: "There are plenty of heartfelt moments amidst the laughs in 'The Office.' This is one of them. Dare I say it brought a tear to my eye?" },
        { quote: "Close your mouth, sweetie. You look like a trout.", character: "Phyllis Vance", episode: "S5E26 - Casual Friday", context: "Another winner from Phyllis Vance, Queen of Mean." },
        { quote: "I got six numbers. One more and it would have been a complete phone number.", character: "Kevin Malone", episode: "S6E5 - Niagara, Part 2", context: "Kevin is an eternal optimist, which might be why he's such a terrible gambler." },
        { quote: "Oh, you're paying too much for worms, man. Who's your worm guy?", character: "Creed Bratton", episode: "S6E5 - Niagara, Part 2", context: "Let's be real: this list could be entirely made up of quotes from Creed, our favorite former rockstar and funnyman. I need to know who his worm guy is." },
        { quote: "I am Beyoncé, always.", character: "Michael Scott", episode: "S6E25 - The Chump", context: "~Flawless~ comeback, Michael." },
        { quote: "You guys I'm, like, really smart now. You don't even know. You could ask me, 'Kelly, what's the biggest company in the world?' And I'd be like, 'blah blah blah, blah blah blah blah blah blah.' Giving you the exact right answer.", character: "Kelly Kapoor", episode: "S7E1 - Nepotism", context: "This episode aired while I was auditing a course at Yale, and about to start grad school. I'm pretty sure this is what I looked like to everyone in *my* office." },
        { quote: "I talk a lot, so I've learned to tune myself out.", character: "Kelly Kapoor", episode: "S7E2 - Counseling", context: "Me, all the time." },
        { quote: "I wanted to eat a pig in a blanket, in a blanket.", character: "Kevin Malone", episode: "S7E8 - Viewing Party", context: "Kevin is the most ambitious person at Dunder Mifflin. Prove me wrong." },
        { quote: "I have a dream, and it's not some MLK dream of equality. I want to own a decommissioned lighthouse. And I want to live at the top. And nobody knows I live there. And there's a button that I can press and launch that lighthouse into space.", character: "Stanley Hudson", episode: "S7E9 - WUPHF.com", context: "In the finale we learn Stanley has moved deep into the swamp, so he can be left alone. Live that dream, buddy." },
        { quote: "I wanna do a cartwheel. But real casual-like. Not enough to make a big deal out of it, but I know everyone saw it. One stunning, gorgeous cartwheel.", character: "Creed Bratton", episode: "S7E13 - The Ultimatum", context: "Screwball perfection." },
        { quote: "I guess I've been working so hard, I forgot what it's like to be hardly working.", character: "Michael Scott", episode: "S7E20 - Training Day", context: "Excellent wordplay, 💯." },
        { quote: "As a person who buys a lot of erotic cakes, it just feels good to be represented on one.", character: "Phyllis Vance", episode: "S7E22 - Goodbye Michael, Part 1", context: "This scene alludes to a real erotic cake shop in LA's Little Ethiopia: Regal Erotic Cake Gallery." },
        { quote: "They're the same picture.", character: "Pam Beesly", episode: "S7E25 - Search Committee, Part 1", context: "You know a show is legendary when it spawns a million memes, and such is the case with The Office." },
        { quote: "Why waste time use lot word when few word do trick?", character: "Kevin Malone", episode: "S8E2 - The Incentive", context: "Sage advice. (I agree with Oscar, for the record. Kevin definitely becomes a caricature of himself on purpose, I think to get more screen time.)" },
        { quote: "We have a gym at home. It's called the bedroom.", character: "Phyllis Vance", episode: "S8E9 - Mrs. California", context: "This is in the scene where Dwight tries to get folks to sign up for his Gym For Muscles, and the ways Oscar, Phyllis, and Kelly all turn him down are amazing." },
        { quote: "Life is short. Drive fast and leave a sexy corpse. That's one of my mottos.", character: "Stanley Hudson", episode: "S8E15 - Tallahassee", context: "It's funny on it's own, and the fact that Jim is deflecting his attention to Stanley to avoid being tempted by Cathy is classic The Office irony." },
        { quote: "Sometimes I get so bored I just want to scream, and then sometimes I actually do scream. I just sort of feel out what the situation calls for.", character: "Kelly Kapoor", episode: "S8E16 - After Hours", context: "The best part of working from home is that it's is socially acceptable to do this ...so long as your roommates don't mind." },
        { quote: "I never thought I'd say this, but I think I ate too much bone marrow.", character: "Dwight Schrute", episode: "S9E26 - Finale", context: "Bone marrow was really having a moment when this episode came out." },
        { quote: "That's what she said!", character: "Michael Scott", episode: "S9E25 - Finale", context: "This is the 44th and final time Michael makes that joke." },
      ],
      "It's Always Sunny in Philadelphia": [
        { quote: "She's dead! Take a good look 'cause she's gone. Ain't no one there. There's no flesh and no bones. She's dead, and she's gone. Goodbye, mom.", character: "Charlie Kelly", episode: "S18E1", context: "Charlie misinterprets a cue and sings a memorial song for his late mother." },
        { quote: "The car is a finisher car. A transporter of Gods. The Golden God! I am untethered, and my rage knows no bounds!", character: "Dennis Reynolds", episode: "S10E6 - The Gang Misses the Boat", context: "Dennis loses it when his Range Rover is called a 'starter car.'" },
        { quote: "Rum Ham! Rum Ham! I'm sorry, Rum Ham, I'm sorry!", character: "Frank Reynolds", episode: "S7E2 - The Gang Goes to the Jersey Shore", context: "Frank wails as his beloved rum-soaked ham floats away at sea." },
        { quote: "You got to pay the troll toll if you want to get into that boy's hole!", character: "Frank Reynolds", episode: "S4E13 - The Nightman Cometh", context: "Frank sings 'hole' instead of 'soul' in Charlie's bizarre stage play." },
        { quote: "Tools! Tools! Duct tape, zip ties, and gloves! I have to have my tools!", character: "Dennis Reynolds", episode: "S7E13 - The High School Reunion", context: "Dennis reveals his kidnapping kit while on a warpath at his reunion." },
        { quote: "You don't want to wash the bar with a water-based liquid.", character: "Charlie Kelly", episode: "S17E4 - Thought Leadership", context: "Charlie cluelessly refuses to clean the bar with water." },
        { quote: "I'm a Swedish plumber. I'm here to fix your pipes.", character: "Mac", episode: "S7E9 - The Gang Gets Trapped", context: "Mac tests his terrible fake Swedish accent over a walkie-talkie." },
        { quote: "I'm the Trash Man! I come out, I throw garbage all over the ring, and then I start eating garbage!", character: "Frank Reynolds", episode: "S5E7 - The Gang Wrestles for the Troops", context: "Frank proudly describes his wrestling persona before eating actual garbage." },
        { quote: "You light ONE b***h on fire and everybody freaks out.", character: "Dee Reynolds", episode: "S9E2 - Gun Fever Too: Still Hot", context: "Dee complains after being denied a gun purchase due to her arson record." },
        { quote: "You haven't thought of the smell, you b***h!", character: "Dennis Reynolds", episode: "S10E3 - Psycho Pete Returns", context: "Dennis snaps while describing why he doesn't have a skin suit collection." },
        { quote: "Tell me I'm good. Tell me I'm good. Tell me I'm good!", character: "Dee Reynolds", episode: "S8E5 - The Gang Gets Analyzed", context: "Dee demands validation from the gang's therapist." },
        { quote: "Whoops, I dropped my monster condom that I use for my magnum dong.", character: "Frank Reynolds", episode: "S5E10 - The D.E.N.N.I.S. System", context: "Frank's absurd pickup line at a carnival." },
        { quote: "Oh, I'm sorry, did you get addicted to crack? Did somebody get addicted to crack?", character: "Mac", episode: "S2E3 - Dennis and Dee Go on Welfare", context: "Mac mocks Dennis and Dee after they actually become crack addicts." },
        { quote: "Ever been in a storm, Wally?", character: "Dennis Reynolds", episode: "S11E5 - Mac and Dennis Move to the Suburbs", context: "Dennis loses his grip on reality while confronting his neighbor." },
        { quote: "Look at that door, dude. See that door right there? The one marked 'Pirate.' Do you think a pirate lives in there?", character: "Charlie Kelly", episode: "S3E6 - The Gang Solves the North Korea Situation", context: "Charlie's illiteracy derails a recon mission at a Korean restaurant." },
        { quote: "What's your spaghetti policy?", character: "Charlie Kelly", episode: "S6E10 - Charlie Kelly: King of the Rats", context: "Charlie asks a spa clerk about bringing in his bag of spaghetti." },
        { quote: "The economy is in shambles.", character: "Mac", episode: "S3E12 - The Gang Gets Whacked, Part 2", context: "Mac blames the economy when he can't afford his share of a drug debt." },
        { quote: "Browning out.", character: "Mac", episode: "S6E7 - Who Got Dee Pregnant?", context: "Mac invents a term for partial blackout drinking that immediately gets mocked." },
        { quote: "How much cheese is too much cheese?", character: "Charlie Kelly", episode: "S5E5 - The Waitress Is Getting Married", context: "Charlie asks this while sweating through his shirt on a blind date." },
        { quote: "So anyway, I started blasting!", character: "Frank Reynolds", episode: "S9E2 - Gun Fever Too: Still Hot", context: "Frank recounts his mugging story on live TV while waving guns around." },
        { quote: "I will eat your babies, b***h!", character: "Dee Reynolds", episode: "S2E5 - Hundred Dollar Baby", context: "Dee threatens her boxing rival while fueled by steroids." },
        { quote: "Bird law in this country is not governed by reason.", character: "Charlie Kelly", episode: "S5E1 - The Gang Exploits the Mortgage Crisis", context: "Charlie defends his nonsensical 'bird law' expertise." },
        { quote: "Wildcard, b*****s!", character: "Charlie Kelly", episode: "S4E2 - The Gang Solves the Gas Crisis", context: "Charlie takes his 'wildcard' role too far and cuts the van's brakes." },
        { quote: "Dee is a bird.", character: "Various", episode: "Various", context: "A running gag where the gang insults Dee by comparing her to a flightless bird." },
        { quote: "Because of the Implication.", character: "Dennis Reynolds", episode: "S6E3 - The Gang Buys a Boat", context: "Dennis explains his sinister plan to trick women on his party boat." },
      ],
      "Modern Family": [
        { quote: "Look at them: A minute ago they were babies, and now they're driving, and soon we'll all be dead.", character: "Claire Dunphy", episode: "S2E24 - The Old Wagon", context: "Claire reflects on how fast her kids are growing up." },
        { quote: "The minute they got rid of rotary phones, everything went to hell.", character: "Jay Pritchett", episode: "S6E16 - Connection Lost", context: "Jay complains about modern technology." },
        { quote: "In my culture, mothers are very clingy to their sons. In fact, the leading cause of death among Colombian women is when their sons get married, but I'm not like that.", character: "Gloria Pritchett", episode: "S2E24 - The Old Wagon", context: "Gloria jokes about overbearing Latin American mothers." },
        { quote: "When life gives you lemonade, make lemons. Life will be all like, 'What?!'", character: "Phil Dunphy", episode: "S4E2 - Schooled", context: "Phil's signature nonsensical twist on a classic saying." },
        { quote: "I don't wanna meet anything on Monday that I'm gonna eat on Friday.", character: "Mitchell Pritchett", episode: "S4E6 - Bad Hair Day", context: "Mitchell explains why he doesn't want to visit a farm." },
        { quote: "I might be coach, but I like to travel first class!", character: "Cameron Tucker", episode: "S6E15 - Fight or Flight", context: "Cameron insists on luxury despite being in coach." },
        { quote: "That's the whole point of a surprise party: you take somebody you really love and you play 'em like a fool.", character: "Jay Pritchett", episode: "S4E12 - Party Crasher", context: "Jay explains his philosophy on surprise parties." },
        { quote: "Success is one per cent inspiration, 98 percent perspiration, and two percent attention to detail.", character: "Phil Dunphy", episode: "S4E2 - Schooled", context: "Phil's hilariously off math on the famous success formula." },
        { quote: "No one wants to think at graduation! It's graduation, the time when we celebrate being done with thinking.", character: "Haley Dunphy", episode: "S2E23 - See You Next Fall", context: "Haley's take on the point of graduation." },
        { quote: "I let down my mom and dad today. And even worse, I let down my teacher.", character: "Alex Dunphy", episode: "S3E21 - Phil on Wire", context: "Alex's priorities are hilariously skewed toward academics." },
        { quote: "Books? Wake up and smell the Internet, grandma.", character: "Luke Dunphy", episode: "S2E22 - Mother's Day", context: "Luke dismisses books in favor of the internet." },
        { quote: "Here's the deal. Girls don't go for all that romantic stuff. They go for power and success, and since you don't have either one of those things… you're gonna be the funny guy.", character: "Jay Pritchett", episode: "S1E9 - Fizbo", context: "Jay gives Manny some questionable dating advice." },
        { quote: "The quinceañera is very important in the Latin culture. The moment the father dances with his little princess—I remember my own father holding my hand. There wasn't a dry eye in the cartel.", character: "Gloria Pritchett", episode: "S2E5 - Strangers on a Treadmill", context: "Gloria casually drops a cartel reference while describing a quinceañera." },
        { quote: "I'm the cool dad. That's my thing. I'm hip. I surf the Web. I text. LOL: laugh out loud. OMG: Oh, my God. WTF: Why the face? You know, I know all the dances to High School Musical.", character: "Phil Dunphy", episode: "S1E1 - Pilot", context: "Phil proudly declares himself the cool dad." },
        { quote: "I would love to be wrong, but I don't live with the right people for that.", character: "Claire Dunphy", episode: "S3E7 - When Good Kids Go Bad", context: "Claire admits she's rarely wrong in her household." },
        { quote: "You'll never go broke playing to a rich man's ego. Write that down.", character: "Manny Delgado", episode: "S3E19 - Door to Door", context: "Manny shares his old-soul business wisdom." },
        { quote: "Belle's a princess. She faced The Beast. She stood up to the townspeople. What have you done?", character: "Lily Tucker-Pritchett", episode: "S5E20 - Other People's Children", context: "Lily sassily compares her mom to a Disney princess." },
        { quote: "I am brave. Roller coasters? Love 'em. Scary movies? I've seen Ghostbusters like, seven times. I regularly drive through neighbourhoods that have only recently been gentrified. So yeah, I'm pretty much not afraid of anything… except for clowns.", character: "Phil Dunphy", episode: "S1E9 - Fizbo", context: "Phil lists his fears and brave moments, ending with clowns." },
        { quote: "It can be challenging finding playmates for an exceptional child. I don't mean to brag, but that's why I didn't have any friends.", character: "Mitchell Pritchett", episode: "S6E12 - The Cold", context: "Mitchell accidentally brags while explaining Lily's social struggles." },
        { quote: "My mother thought that riding a bike was dangerous. She would say, 'That's how people grab you!'", character: "Gloria Pritchett", episode: "S2E10 - Slow Down Your Neighbors", context: "Gloria shares her mother's paranoid view of bike riding." },
        { quote: "There's a caste system at school. Academic teachers at the top, gym teachers at the bottom. It's offensive and disrespectful, they treat us like we're lunch ladies.", character: "Cameron Tucker", episode: "S5E18 - Under Pressure", context: "Cam complains about the hierarchy among teachers." },
        { quote: "Dad, we can always find cool stuff to do. Even if you're old and in a wheelchair, I'll take you to the mall and push you as fast as you wanna go. And I'll take you to the top of a huge hill and just let go.", character: "Luke Dunphy", episode: "S3E22 - Disneyland", context: "Luke's idea of caring for an elderly Phil is hilariously dangerous." },
        { quote: "What kind of man writes poetry on a computer?", character: "Manny Delgado", episode: "S3E17 - Games People Play", context: "Manny questions the authenticity of digital poetry." },
        { quote: "You know how growing up we all have that voice inside our head that tells us we're not good enough? Well, mine was outside my head driving me to school.", character: "Claire Dunphy", episode: "S1E18 - The Incident", context: "Claire blames her mother for her insecurities." },
        { quote: "The only time I break a sweat is when we run after the ice cream truck.", character: "Phil Dunphy", episode: "S9E5 - Chips and Salsa", context: "Phil explains his unique approach to fitness." },
      ],
      "Parks and Recreation": [
        { quote: "Great job, everyone. The reception will be held in each of our individual houses alone.", character: "Ron Swanson", episode: "S6E1 - London, Part 1", context: "Ron's ideal wedding reception after his impromptu ceremony." },
        { quote: "Yes I am a hunter and it's you season.", character: "Donna Meagle", episode: "S2E20 - The Master Plan", context: "Donna suggests this as a pickup line for Tom." },
        { quote: "Hey, Leslie. It's Leslie. Hang in there. I love you. Bye.", character: "Leslie Knope", episode: "S2E22 - Telethon", context: "Leslie calls herself for a pep talk during the telethon." },
        { quote: "Shock wire, I call it that because if you take a shower and you touch the wire, you die.", character: "Andy Dwyer", episode: "S4E5 - Meet 'n' Greet", context: "Andy casually explains an exposed wire at his Halloween party." },
        { quote: "There's only one thing I hate more than lying: skim milk. Which is water that is lying about being milk.", character: "Ron Swanson", episode: "S5E17 - Recall Vote", context: "Ron shares his views during a deposition." },
        { quote: "Everybody pants now! Pants, pants, pants, pants.", character: "Leslie Knope", episode: "S4E2 - Ron & Tammys", context: "A drunk Leslie sings this during the Swanson battle royale." },
        { quote: "I don't care about that prize, but I'm gonna win because I want his happiness to go away.", character: "April Ludgate", episode: "S4E13 - Bowling for Votes", context: "April explains her motivation to beat Chris." },
        { quote: "I will wear that red thing when you deserve to see me in that red thing.", character: "Donna Meagle", episode: "S6E20 - One Last Ride", context: "Donna flirts with Joe on her own terms." },
        { quote: "Leslie, I typed in your symptoms into the thing up here and it says you could have network connectivity problems.", character: "Andy Dwyer", episode: "S3E2 - Flu Season", context: "Andy tries to diagnose Leslie using a computer." },
        { quote: "You can't say your favorite kind of cake is birthday cake, that's like saying your favorite kind of cereal is breakfast cereal.", character: "Tom Haverford", episode: "S2E10 - Hunting Trip", context: "Tom makes a surprisingly valid point about cake." },
        { quote: "Your house isn't haunted. You're lonely.", character: "Ron Swanson", episode: "S5E13 - Emergency Response", context: "Ron gives blunt advice to a caller on Pawnee Today." },
        { quote: "You just do yo thang, baby Smurf.", character: "Ben Wyatt", episode: "S5E17 - Recall Vote", context: "Ben says this to Leslie while high on pain medication." },
        { quote: "We have a new policy. Parks can only be reserved for witch covens and slip n' slide competitions. Which one are you?", character: "April Ludgate", episode: "S6E5 - Filibuster", context: "April meets her match in a deadpan citizen." },
        { quote: "The show must go wrong. Everything always goes wrong, and you just have to deal with it.", character: "Andy Dwyer", episode: "S2E24 - Freddy Spaghetti", context: "Andy gives Leslie a pep talk before the concert." },
        { quote: "The only thing I will be waving is your decapitated head on a stick in front of your weeping mother!", character: "Leslie Knope", episode: "S4E7 - The Treaty", context: "Leslie gets ruthlessly competitive at Model UN." },
        { quote: "I'm just going to stay angry, I find it relaxes me.", character: "Ron Swanson", episode: "S2E10 - Hunting Trip", context: "Ron copes with being accidentally shot by Tom." },
        { quote: "If you don't believe in love, what's the point of living?", character: "Ron Swanson", episode: "S2E8 - Ron and Tammy", context: "Ron reveals his sentimental side after a rough night with Tammy." },
        { quote: "Are the cones a metaphor? Well, yes and no.", character: "Ben Wyatt", episode: "S6E9 - The Cones of Dunshire", context: "Ben explains his new board game to Leslie." },
        { quote: "Erase all pictures of Ron!", character: "Ron Swanson", episode: "S6E3 - Doppelgängers", context: "Ron struggles with voice commands while erasing himself from the internet." },
        { quote: "I'm going to go home and feel totally fine. Who am I kidding? I'm going to go home, put on a Macy Gray album, and cry in the mirror!", character: "Craig Middlebrooks", episode: "S6E19 - Galentine's Day", context: "Craig vents after the wine tasting competition." },
        { quote: "It's really hard to say congrats without sounding sarcastic.", character: "Ann Perkins", episode: "S4E14 - Operation Ann", context: "Ann reflects on being single at Galentine's Day brunch." },
        { quote: "I found a sandwich on a bench at one of your parks, and I want to know why it didn't have any mayonnaise on it.", character: "Pawnee Citizen", episode: "S2E12 - Christmas Scandal", context: "A citizen complains at the public forum." },
        { quote: "I regret nothing. The end.", character: "Ron Swanson", episode: "S5E17 - Recall Vote", context: "Ron refuses to apologize to Jamm." },
        { quote: "When people get too chummy with me, I like to call them by the wrong name to let them know I don't really care about them.", character: "Ron Swanson", episode: "S4E3 - Born & Raised", context: "Ron explains his strategy for keeping people at a distance." },
        { quote: "I am 100 percent sure I am 0 percent sure of what to do.", character: "Chris Traeger", episode: "S5E16 - Bailout", context: "Chris struggles with Ann's request to be her sperm donor." },
        { quote: "No one knows what they're doing…deep down, everyone is just faking it until they figure it out.", character: "April Ludgate", episode: "S6E6 - Doppelgängers", context: "April reassures a panicking Andy about his job." },
        { quote: "Well, you know, it's like I always say: 'It ain't government work if you don't have to do it twice.'", character: "Jerry Gergich", episode: "S4E18 - Lucky Break", context: "Jerry sums up government inefficiency after a mailing mistake." },
        { quote: "I don't want to do things. I want to not do things like you taught me.", character: "April Ludgate", episode: "S4E17 - Campaign Shake-Up", context: "April reminds Ron of his mentorship." },
        { quote: "If I keep my body moving, and my mind occupied at all times, I will avoid falling into a bottomless pit of despair.", character: "Chris Traeger", episode: "S4E21 - Bus Tour", context: "Chris reveals his coping mechanism during a crisis." },
        { quote: "You are a beautiful, talented, brilliant, powerful musk ox.", character: "Leslie Knope", episode: "S5E6 - Ben's Parents", context: "Leslie gives Ann a bizarre but sweet compliment." },
        { quote: "Jogging is the worst! I know it keeps you healthy, but God, at what cost?", character: "Ann Perkins", episode: "S4E7 - The Treaty", context: "Ann complains about exercise to Chris." },
        { quote: "There has never been a sadness that can't been cured by breakfast food.", character: "Ron Swanson", episode: "S6E13 - Ann and Chris", context: "Ron comforts Leslie after Ann and Chris leave Pawnee." },
        { quote: "If you don't like what I post, don't follow me.", character: "Donna Meagle", episode: "S5E5 - Halloween Surprise", context: "Donna claps back at a follower who complains about her tweets." },
        { quote: "One person's annoying is another's inspiring and heroic.", character: "Leslie Knope", episode: "S6E5 - Filibuster", context: "Leslie responds to learning Donna once found her annoying." },
        { quote: "Sometimes you gotta work a little so you can ball a lot.", character: "Tom Haverford", episode: "S5E6 - Ben's Parents", context: "Tom explains his new work ethic to Jean-Ralphio." },
        { quote: "I don't want to be overdramatic, but today felt like a hundred years in hell and the absolute worst day of my life.", character: "Leslie Knope", episode: "S1E4 - Boys' Club", context: "Leslie's dramatic reaction after the gift basket fiasco." },
        { quote: "They'll only talk to you or me. And I can't go because I don't want to.", character: "Ron Swanson", episode: "S2E11 - Tom's Divorce", context: "Ron explains why he can't attend a meeting." },
        { quote: "I guess I kind of hate most things. But I never really seem to hate you.", character: "April Ludgate", episode: "S3E9 - Andy and April's Fancy Party", context: "April's sweet wedding vows to Andy." },
        { quote: "Well miss, I think we'd all appreciate it if you just swallowed a teaspoon of hush.", character: "Tom Haverford", episode: "S6E8 - Fluoride", context: "Tom delivers a clever retort to an interrupter." },
        { quote: "Oh, I have a medical condition all right. It's called caring too much! And it's incurable!", character: "Craig Middlebrooks", episode: "S6E4 - Doppelgängers", context: "Craig responds to Donna's assumption about his behavior." },
        { quote: "In the grand scheme of things, who cares? We're all just molecules, floating around in random patterns devoid of meaning.", character: "Chris Traeger", episode: "S4E19 - Live Ammo", context: "Chris shows a nihilistic side during Leslie's election." },
        { quote: "There is no quiet anymore. There is only Doc McStuffins.", character: "Ron Swanson", episode: "S6E17 - The Wall", context: "Ron reflects on fatherhood and the loss of peace and quiet." },
        { quote: "I also think it's pointless for a human to paint scenes of nature when they can go outside and stand in it.", character: "Ron Swanson", episode: "S3E11 - Jerry's Painting", context: "Ron shares his views at the Pawnee art show." },
        { quote: "If I seem too passionate, it's because I care. And if I come on strong, it's because I feel strongly. If I push too hard, it's because things aren't happening fast enough.", character: "Leslie Knope", episode: "S4E20 - The Debate", context: "Leslie defines herself in her campaign speech." },
        { quote: "Dear frozen yogurt, you are the celery of desserts. Be ice cream, or be nothing. Zero stars.", character: "Ron Swanson", episode: "S6E14 - Ann and Chris", context: "Ron writes a negative review on his typewriter." },
        { quote: "Treat yo self.", character: "Donna Meagle and Tom Haverford", episode: "S4E4 - Pawnee Rangers", context: "Donna and Tom's annual day of luxurious self-care." },
        { quote: "I am a goddess, a glorious female warrior, queen of all that I survey.", character: "Leslie Knope", episode: "S4E4 - Pawnee Rangers", context: "Part of the Pawnee Goddesses pledge." },
        { quote: "Time is money; money is power; power is pizza; pizza is knowledge. Let's go!", character: "April Ludgate", episode: "S6E10 - Second Chunce", context: "April's nonsensical but iconic motivational statement." },
        { quote: "Never half-a** two things. Whole a** one thing.", character: "Ron Swanson", episode: "S4E16 - Win, Lose, or Draw", context: "Ron's advice to Leslie about focusing her energy." },
        { quote: "We need to remember what's important in life: friends, waffles, work. Or waffles, friends, work. Doesn't matter, but work is third.", character: "Leslie Knope", episode: "S3E13 - The Fight", context: "Leslie shares her priorities in life." },
      ]
    };

    // Get show names
    const showNames = Object.keys(QUOTES);

    // ---------- GAME STATE ----------
    let players = [];
    let scores = {};
    let currentMode = 'fun';
    let roundLimit = 10;
    let currentRound = 0;
    let gameOver = false;
    let gameStarted = false;
    let scoredThisQuestion = {};
    let enabledShows = {};
    let currentQuote = null;

    // DOM refs
    const funPanel = document.getElementById('funModePanel');
    const compPanel = document.getElementById('compModePanel');
    const funModeBtn = document.getElementById('funModeBtn');
    const compModeBtn = document.getElementById('compModeBtn');
    const startBtn = document.getElementById('startGameBtn');
    const startArea = document.getElementById('startArea');
    const configPanel = document.getElementById('configPanel');
    const configPanel2 = document.getElementById('configPanel2');
    const showToggleGroup = document.getElementById('showToggleGroup');
    const quoteCountSpan = document.getElementById('quoteCount');

    const playersContainer = document.getElementById('playersContainer');
    const playerNameInput = document.getElementById('playerNameInput');
    const addPlayerBtn = document.getElementById('addPlayerBtn');

    const funQuote = document.getElementById('funQuote');
    const funAnswer = document.getElementById('funAnswer');
    const funShow = document.getElementById('funShow');
    const funCharacter = document.getElementById('funCharacter');
    const funEpisode = document.getElementById('funEpisode');
    const funContext = document.getElementById('funContext');
    const funRevealBtn = document.getElementById('funRevealBtn');
    const funNewBtn = document.getElementById('funNewBtn');
    const funQuitBtn = document.getElementById('funQuitBtn');

    const compQuote = document.getElementById('compQuote');
    const compAnswer = document.getElementById('compAnswer');
    const compShow = document.getElementById('compShow');
    const compCharacter = document.getElementById('compCharacter');
    const compEpisode = document.getElementById('compEpisode');
    const compContext = document.getElementById('compContext');
    const compRevealBtn = document.getElementById('compRevealBtn');
    const compNewQuestionBtn = document.getElementById('compNewQuestionBtn');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const compGameOver = document.getElementById('compGameOver');
    const correctMarkers = document.getElementById('correctMarkers');
    const questionCounter = document.getElementById('questionCounter');
    const scoringStatus = document.getElementById('scoringStatus');
    const roundSelector = document.getElementById('roundSelector');
    const compQuitBtn = document.getElementById('compQuitBtn');

    // ---------- helper functions ----------
    function getEnabledQuotes() {
      const enabledList = [];
      for (const [show, quotes] of Object.entries(QUOTES)) {
        if (enabledShows[show]) {
          quotes.forEach(q => {
            enabledList.push({ ...q, show: show });
          });
        }
      }
      return enabledList;
    }

    function getRandomQuote() {
      const enabled = getEnabledQuotes();
      if (enabled.length === 0) {
        alert('No shows enabled! Please enable at least one show.');
        return null;
      }
      return enabled[Math.floor(Math.random() * enabled.length)];
    }

    function renderQuote(q, quoteEl, answerEl, showEl, charEl, epEl, ctxEl) {
      if (!q) {
        quoteEl.textContent = 'No quotes available. Enable a show!';
        answerEl.classList.add('hidden');
        return;
      }
      quoteEl.textContent = `"${q.quote}"`;
      showEl.textContent = q.show || '—';
      charEl.textContent = q.character || '—';
      epEl.textContent = q.episode || '—';
      ctxEl.textContent = q.context || '—';
      answerEl.classList.add('hidden');
    }

    function handleReveal(answerEl) {
      if (!currentQuote) return;
      answerEl.classList.remove('hidden');
    }

    // ---------- Show Toggles ----------
    function renderShowToggles() {
      showToggleGroup.innerHTML = '';
      showNames.forEach(show => {
        const label = document.createElement('label');
        label.className = 'show-toggle';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = enabledShows[show] !== false;
        checkbox.dataset.show = show;
        checkbox.addEventListener('change', function() {
          enabledShows[this.dataset.show] = this.checked;
          updateQuoteCount();
        });
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(show));
        showToggleGroup.appendChild(label);
      });
      updateQuoteCount();
    }

    function updateQuoteCount() {
      const count = getEnabledQuotes().length;
      quoteCountSpan.textContent = count;
    }

    // ---------- update players UI ----------
    function renderPlayers() {
      playersContainer.innerHTML = '';
      if (players.length === 0) {
        const empty = document.createElement('span');
        empty.textContent = 'Add players';
        empty.style.color = '#b8b09a';
        empty.style.fontSize = '0.9rem';
        playersContainer.appendChild(empty);
        return;
      }
      players.forEach(name => {
        const tag = document.createElement('span');
        tag.className = 'player-tag';
        tag.innerHTML = `${name} <button class="remove-btn" data-name="${name}">✕</button>`;
        playersContainer.appendChild(tag);
      });
      document.querySelectorAll('.player-tag .remove-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const name = e.target.dataset.name;
          removePlayer(name);
        });
      });
      updateScoreDisplay();
    }

    function addPlayer(name) {
      const trimmed = name.trim();
      if (!trimmed) return false;
      if (players.includes(trimmed)) return false;
      players.push(trimmed);
      scores[trimmed] = 0;
      scoredThisQuestion[trimmed] = false;
      renderPlayers();
      updateScoreDisplay();
      return true;
    }

    function removePlayer(name) {
      players = players.filter(p => p !== name);
      delete scores[name];
      delete scoredThisQuestion[name];
      renderPlayers();
      updateScoreDisplay();
    }

    // ---------- scoring / competitive ----------
    function updateScoreDisplay() {
      scoreDisplay.innerHTML = '';
      if (players.length === 0) {
        scoreDisplay.innerHTML = '<span style="color:#b8b09a;">Add players to track scores</span>';
        return;
      }
      players.forEach(name => {
        const badge = document.createElement('span');
        badge.className = 'score-badge';
        badge.innerHTML = `${name} <span>${scores[name] || 0}</span>`;
        scoreDisplay.appendChild(badge);
      });
    }

    function renderCorrectMarkers() {
      correctMarkers.innerHTML = '';
      if (players.length === 0) {
        correctMarkers.innerHTML = '<span style="color:#b8b09a;font-size:0.9rem;">No players</span>';
        return;
      }
      players.forEach(name => {
        const btn = document.createElement('button');
        btn.textContent = name;
        btn.className = 'score-btn';
        btn.dataset.player = name;
        btn.style.background = '#2b4f3a';
        btn.style.border = '1px solid #5a7a4b';
        btn.style.color = '#f3e9d2';
        btn.style.padding = '6px 14px';
        btn.style.borderRadius = '40px';
        btn.style.fontSize = '0.8rem';
        btn.style.cursor = 'pointer';
        btn.style.transition = 'all 0.1s';
        btn.addEventListener('click', () => {
          if (gameOver || !gameStarted || currentMode !== 'competitive') return;
          if (currentQuote === null) {
            alert('No quote loaded!');
            return;
          }
          if (scoredThisQuestion[name]) {
            alert(`${name} already got a point for this question!`);
            return;
          }
          if (scores[name] !== undefined) {
            scores[name] = (scores[name] || 0) + 1;
            scoredThisQuestion[name] = true;
            updateScoreDisplay();
            updateScoringUI();
            btn.style.background = '#4a6e3b';
            btn.style.borderColor = '#7c9a6b';
            btn.disabled = true;
          }
        });
        correctMarkers.appendChild(btn);
      });
      updateScoringUI();
    }

    function updateScoringUI() {
      document.querySelectorAll('.score-btn').forEach(btn => {
        const name = btn.dataset.player;
        if (scoredThisQuestion[name]) {
          btn.style.background = '#4a6e3b';
          btn.style.borderColor = '#7c9a6b';
          btn.disabled = true;
        } else if (currentQuote && !document.getElementById('compAnswer').classList.contains('hidden')) {
          btn.style.background = '#2b4f3a';
          btn.style.borderColor = '#5a7a4b';
          btn.disabled = false;
        } else {
          btn.style.background = '#2b4f3a';
          btn.style.borderColor = '#5a7a4b';
          btn.disabled = true;
        }
      });

      const answerVisible = !document.getElementById('compAnswer').classList.contains('hidden');
      if (!answerVisible) {
        scoringStatus.textContent = 'Reveal the answer to enable scoring';
      } else {
        const scored = Object.values(scoredThisQuestion).filter(v => v === true).length;
        const total = players.length;
        if (scored === total && total > 0) {
          scoringStatus.textContent = 'All players have scored for this question!';
        } else {
          scoringStatus.textContent = `Click player names to award points (${scored}/${total} scored)`;
        }
      }
    }

    function compNewQuestion() {
      if (!gameStarted) {
        alert('Start the game first!');
        return;
      }
      if (gameOver) {
        resetCompetitiveGame();
        return;
      }
      if (players.length === 0) {
        alert('Add at least one player for competitive mode.');
        return;
      }
      if (roundLimit !== 0 && currentRound >= roundLimit) {
        gameOver = true;
        compGameOver.classList.remove('hidden');
        compGameOver.textContent = `Game Over! ${roundLimit} questions completed.`;
        compNewQuestionBtn.textContent = 'New Game';
        updateQuestionCounter();
        scoringStatus.textContent = 'Game over!';
        return;
      }

      players.forEach(name => {
        scoredThisQuestion[name] = false;
      });

      const q = getRandomQuote();
      if (!q) {
        alert('No enabled shows with quotes! Please enable at least one show.');
        return;
      }
      currentQuote = q;
      currentRound++;
      renderQuote(q, compQuote, compAnswer, compShow, compCharacter, compEpisode, compContext);
      compGameOver.classList.add('hidden');
      renderCorrectMarkers();
      updateScoreDisplay();
      updateQuestionCounter();
      scoringStatus.textContent = 'Reveal the answer to enable scoring';
    }

    function resetCompetitiveGame() {
      currentRound = 0;
      gameOver = false;
      compGameOver.classList.add('hidden');
      compNewQuestionBtn.textContent = 'Next Question';
      players.forEach(name => { 
        scores[name] = 0;
        scoredThisQuestion[name] = false;
      });
      updateScoreDisplay();
      updateQuestionCounter();
      scoringStatus.textContent = 'Reveal the answer to enable scoring';
      if (gameStarted) {
        compNewQuestion();
      }
    }

    function updateQuestionCounter() {
      const total = roundLimit === 0 ? '∞' : roundLimit;
      questionCounter.textContent = `Question ${currentRound} / ${total}`;
    }

    // ---------- Quit game ----------
    function quitGame() {
      if (!gameStarted) return;
      if (!confirm('Are you sure you want to quit the game? Progress will be lost.')) return;
      resetGameState();
      configPanel.classList.remove('hidden');
      configPanel2.classList.remove('hidden');
      startArea.classList.remove('hidden');
      funPanel.classList.add('hidden');
      compPanel.classList.add('hidden');
      players.forEach(name => {
        scores[name] = 0;
        scoredThisQuestion[name] = false;
      });
      updateScoreDisplay();
      updateQuestionCounter();
      compGameOver.classList.add('hidden');
      compNewQuestionBtn.textContent = 'Next Question';
      document.querySelectorAll('#roundSelector button').forEach(btn => {
        btn.disabled = false;
      });
      startBtn.disabled = false;
      startBtn.textContent = '▶ Start Game';
      gameStarted = false;
      currentQuote = null;
    }

    // ---------- start game ----------
    function startGame() {
      const enabled = getEnabledQuotes();
      if (enabled.length === 0) {
        alert('Please enable at least one show with quotes!');
        return;
      }
      if (currentMode === 'competitive' && players.length === 0) {
        alert('Please add at least one player for Competitive mode.');
        return;
      }
      gameStarted = true;
      startBtn.disabled = true;
      startBtn.textContent = 'Game in progress';

      configPanel.classList.add('hidden');
      configPanel2.classList.add('hidden');
      startArea.classList.add('hidden');

      document.querySelectorAll('#roundSelector button').forEach(btn => {
        btn.disabled = true;
      });

      if (currentMode === 'fun') {
        funPanel.classList.remove('hidden');
        compPanel.classList.add('hidden');
        generateFunQuestion();
        scoringStatus.textContent = '';
      } else {
        funPanel.classList.add('hidden');
        compPanel.classList.remove('hidden');
        currentRound = 0;
        gameOver = false;
        players.forEach(name => { 
          scores[name] = 0;
          scoredThisQuestion[name] = false;
        });
        updateScoreDisplay();
        updateQuestionCounter();
        compGameOver.classList.add('hidden');
        compNewQuestionBtn.textContent = 'Next Question';
        compNewQuestion();
      }
    }

    // ---------- switch mode ----------
    function setMode(mode) {
      if (gameStarted) {
        if (!confirm('Changing mode will reset the game. Continue?')) return;
        resetGameState();
      }
      currentMode = mode;
      if (mode === 'fun') {
        funPanel.classList.add('hidden');
        compPanel.classList.add('hidden');
        funModeBtn.classList.add('active');
        compModeBtn.classList.remove('active');
        startBtn.disabled = false;
        startBtn.textContent = '▶ Start Game';
        gameStarted = false;
        scoringStatus.textContent = '';
        configPanel.classList.remove('hidden');
        configPanel2.classList.remove('hidden');
        startArea.classList.remove('hidden');
        document.querySelectorAll('#roundSelector button').forEach(btn => {
          btn.disabled = false;
        });
      } else {
        funPanel.classList.add('hidden');
        compPanel.classList.add('hidden');
        compModeBtn.classList.add('active');
        funModeBtn.classList.remove('active');
        startBtn.disabled = false;
        startBtn.textContent = '▶ Start Game';
        gameStarted = false;
        currentRound = 0;
        gameOver = false;
        players.forEach(name => { 
          scores[name] = 0;
          scoredThisQuestion[name] = false;
        });
        updateScoreDisplay();
        updateQuestionCounter();
        compGameOver.classList.add('hidden');
        compNewQuestionBtn.textContent = 'Next Question';
        scoringStatus.textContent = 'Reveal the answer to enable scoring';
        configPanel.classList.remove('hidden');
        configPanel2.classList.remove('hidden');
        startArea.classList.remove('hidden');
        document.querySelectorAll('#roundSelector button').forEach(btn => {
          btn.disabled = false;
        });
      }
    }

    function resetGameState() {
      gameStarted = false;
      startBtn.disabled = false;
      startBtn.textContent = '▶ Start Game';
      gameOver = false;
      currentRound = 0;
      players.forEach(name => { 
        scores[name] = 0;
        scoredThisQuestion[name] = false;
      });
      updateScoreDisplay();
      compGameOver.classList.add('hidden');
      compNewQuestionBtn.textContent = 'Next Question';
      updateQuestionCounter();
      scoringStatus.textContent = '';
      configPanel.classList.remove('hidden');
      configPanel2.classList.remove('hidden');
      startArea.classList.remove('hidden');
      document.querySelectorAll('#roundSelector button').forEach(btn => {
        btn.disabled = false;
      });
    }

    function generateFunQuestion() {
      if (!gameStarted) return;
      const q = getRandomQuote();
      if (!q) {
        alert('No enabled shows with quotes! Please enable at least one show.');
        return;
      }
      currentQuote = q;
      renderQuote(q, funQuote, funAnswer, funShow, funCharacter, funEpisode, funContext);
    }

    // ---------- event binding ----------
    function init() {
      // Initialize enabled shows
      showNames.forEach(show => {
        enabledShows[show] = true;
      });
      renderShowToggles();

      funModeBtn.addEventListener('click', () => setMode('fun'));
      compModeBtn.addEventListener('click', () => setMode('competitive'));

      startBtn.addEventListener('click', startGame);

      funQuitBtn.addEventListener('click', quitGame);
      compQuitBtn.addEventListener('click', quitGame);

      addPlayerBtn.addEventListener('click', () => {
        const name = playerNameInput.value.trim();
        if (addPlayer(name)) {
          playerNameInput.value = '';
          if (currentMode === 'competitive') {
            renderCorrectMarkers();
            updateScoreDisplay();
          }
        } else {
          alert('Invalid or duplicate name.');
        }
      });
      playerNameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') addPlayerBtn.click();
      });

      funRevealBtn.addEventListener('click', function() {
        if (!gameStarted) { alert('Start the game first!'); return; }
        if (!currentQuote) return;
        handleReveal(funAnswer);
      });
      funNewBtn.addEventListener('click', generateFunQuestion);

      compRevealBtn.addEventListener('click', function() {
        if (!gameStarted) { alert('Start the game first!'); return; }
        if (!currentQuote) return;
        handleReveal(compAnswer);
        updateScoringUI();
      });

      compNewQuestionBtn.addEventListener('click', compNewQuestion);

      document.querySelectorAll('#roundSelector button').forEach(btn => {
        btn.addEventListener('click', function() {
          if (gameStarted) {
            if (!confirm('Changing round limit will reset the game. Continue?')) return;
            resetGameState();
          }
          document.querySelectorAll('#roundSelector button').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          const val = parseInt(this.dataset.round, 10);
          roundLimit = val;
          if (currentMode === 'competitive') {
            updateQuestionCounter();
            scoringStatus.textContent = 'Reveal the answer to enable scoring';
          }
        });
      });

      renderPlayers();
      setMode('fun');
    }

    init();
  })();
</script>
</body>
</html>
