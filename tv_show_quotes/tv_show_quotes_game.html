<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>TV Quote Quiz</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #1e3a2b;
      color: #f3e9d2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      margin: 0;
    }

    #app {
      max-width: 480px;
      width: 100%;
      background: #1e3a2b;
      border-radius: 32px;
      padding: 20px 16px 30px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      border: 1px solid #5a7a4b;
    }

    h1 {
      text-align: center;
      font-weight: 600;
      letter-spacing: 1px;
      font-size: 2rem;
      margin-bottom: 12px;
      color: #f3e9d2;
      border-bottom: 2px dashed #5a7a4b;
      padding-bottom: 10px;
    }

    .mode-toggle {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .mode-btn {
      background: #2b4f3a;
      border: 2px solid #5a7a4b;
      color: #f3e9d2;
      padding: 10px 24px;
      border-radius: 60px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      flex: 1;
      text-align: center;
    }

    .mode-btn.active {
      background: #5a7a4b;
      border-color: #c4b08a;
      color: #f3e9d2;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .mode-btn:active { transform: scale(0.96); }

    .panel {
      background: #1e3a2b;
      border-radius: 24px;
      padding: 16px 12px;
      margin-bottom: 20px;
      border: 1px solid #5a7a4b;
    }

    .players-area {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 10px;
      margin-bottom: 6px;
    }

    .player-tag {
      background: #2b4f3a;
      padding: 6px 16px 6px 14px;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      border: 1px solid #5a7a4b;
    }

    .player-tag .remove-btn {
      background: none;
      border: none;
      color: #d6b68b;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
    }

    .player-tag .remove-btn:active { opacity: 0.6; }

    .add-player-form {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .add-player-form input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 60px;
      border: 1px solid #5a7a4b;
      background: #2b4f3a;
      color: #f3e9d2;
      font-size: 0.95rem;
      min-width: 120px;
    }

    .add-player-form input::placeholder { color: #b8b09a; }

    .add-player-form button {
      background: #5a7a4b;
      border: none;
      color: #f3e9d2;
      padding: 10px 20px;
      border-radius: 60px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      border: 1px solid #7c9a6b;
      transition: 0.1s;
    }

    .add-player-form button:active { background: #4a6e3b; }

    .config-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 8px 0 4px;
    }

    .config-label {
      font-weight: 500;
      font-size: 0.95rem;
    }

    .round-selector {
      display: flex;
      gap: 6px;
      background: #1e3a2b;
      padding: 4px;
      border-radius: 60px;
      border: 1px solid #5a7a4b;
    }

    .round-selector button {
      background: transparent;
      border: none;
      color: #f3e9d2;
      padding: 6px 14px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.1s;
    }

    .round-selector button.active {
      background: #5a7a4b;
      color: #f3e9d2;
    }

    .round-selector button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .show-toggle-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .show-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #2b4f3a;
      padding: 4px 12px 4px 8px;
      border-radius: 40px;
      border: 1px solid #5a7a4b;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
    }

    .show-toggle input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #5a7a4b;
      cursor: pointer;
    }

    .show-toggle.disabled {
      opacity: 0.5;
    }

    .question-box {
      background: #1e3a2b;
      padding: 18px 10px;
      border-radius: 20px;
      border: 1px solid #5a7a4b;
      margin: 16px 0 12px;
    }

    .quote-display {
      font-size: 1.2rem;
      line-height: 1.6;
      padding: 12px 16px;
      background: #2b4f3a;
      border-radius: 40px;
      text-align: center;
      font-style: italic;
      border-left: 6px solid #c4b08a;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .answer-details {
      margin-top: 12px;
      padding: 14px 16px;
      background: #2b4f3a;
      border-radius: 20px;
      border-left: 6px solid #d6b68b;
    }

    .answer-details .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #3a5a4a;
    }

    .answer-details .detail-row:last-child {
      border-bottom: none;
    }

    .answer-details .label {
      font-weight: 600;
      color: #c4b08a;
    }

    .answer-details .value {
      text-align: right;
      margin-left: 12px;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin: 18px 0 6px;
    }

    .action-btn {
      background: #2b4f3a;
      border: 2px solid #5a7a4b;
      color: #f3e9d2;
      padding: 12px 22px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      flex: 1 0 auto;
      transition: 0.1s;
    }

    .action-btn:active { background: #3f664d; }
    .action-btn.reveal { background: #6d4f3a; border-color: #b28b6b; }
    .action-btn.primary { background: #4a6e3b; border-color: #7c9a6b; }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .action-btn.quit { background: #6d3a3a; border-color: #8b4b4b; }

    .competitive-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 12px 0 6px;
    }

    .score-area {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 12px;
      margin: 12px 0 6px;
    }

    .score-badge {
      background: #2b4f3a;
      padding: 4px 14px;
      border-radius: 60px;
      font-size: 0.9rem;
      border: 1px solid #5a7a4b;
    }

    .score-badge span { font-weight: 700; margin-left: 6px; }

    .win-message {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 12px;
      background: #2b4f3a;
      border-radius: 60px;
      margin: 10px 0;
    }

    .footer-note {
      font-size: 0.7rem;
      text-align: center;
      color: #b8b09a;
      margin-top: 16px;
      opacity: 0.8;
    }

    .hidden { display: none; }
    .flex-center { display: flex; justify-content: center; }

    .start-area {
      text-align: center;
      margin: 20px 0 10px;
    }

    .start-btn {
      background: #5a7a4b;
      border: 2px solid #7c9a6b;
      color: #f3e9d2;
      padding: 14px 40px;
      border-radius: 60px;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.1s;
      width: 100%;
    }

    .start-btn:active { background: #4a6e3b; }
    .start-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .question-counter {
      text-align: center;
      font-weight: 500;
      font-size: 1rem;
      background: #2b4f3a;
      padding: 6px 12px;
      border-radius: 60px;
      display: inline-block;
      margin: 0 auto 8px;
      border: 1px solid #5a7a4b;
    }

    .scoring-disabled-note {
      text-align: center;
      font-size: 0.85rem;
      color: #b8b09a;
      margin: 8px 0;
      font-style: italic;
    }

    .quit-area {
      text-align: center;
      margin-top: 12px;
    }

    .quit-btn {
      background: #6d3a3a;
      border: 2px solid #8b4b4b;
      color: #f3e9d2;
      padding: 10px 30px;
      border-radius: 60px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.1s;
    }

    .quit-btn:active { background: #5a2e2e; }
  </style>
</head>
<body>
<div id="app">
  <h1>📺 Quote Quiz</h1>

  <!-- mode toggle -->
  <div class="mode-toggle">
    <button id="funModeBtn" class="mode-btn active">Fun</button>
    <button id="compModeBtn" class="mode-btn">Competitive</button>
  </div>

  <!-- PLAYER PANEL -->
  <div class="panel" id="configPanel">
    <div id="playersContainer" class="players-area"></div>
    <div class="add-player-form">
      <input type="text" id="playerNameInput" placeholder="Player name" maxlength="20">
      <button id="addPlayerBtn">+ Add</button>
    </div>
  </div>

  <!-- CONFIGURATION -->
  <div class="panel" id="configPanel2">
    <div class="config-row">
      <span class="config-label">📊 Questions:</span>
      <div class="round-selector" id="roundSelector">
        <button data-round="10" class="active">10</button>
        <button data-round="25">25</button>
        <button data-round="0">∞</button>
      </div>
    </div>
    <div class="config-row" style="margin-top: 12px;">
      <span class="config-label">📺 Shows:</span>
    </div>
    <div class="show-toggle-group" id="showToggleGroup">
      <!-- Toggles will be generated from QUOTES data -->
    </div>
  </div>

  <!-- START BUTTON -->
  <div class="start-area" id="startArea">
    <button id="startGameBtn" class="start-btn">▶ Start Game</button>
  </div>

  <!-- FUN MODE UI -->
  <div id="funModePanel" class="hidden">
    <div class="question-box" id="funQuestionBox">
      <div class="quote-display" id="funQuote">—</div>
      <div id="funAnswer" class="answer-details hidden">
        <div class="detail-row"><span class="label">Show:</span><span class="value" id="funShow">—</span></div>
        <div class="detail-row"><span class="label">Character:</span><span class="value" id="funCharacter">—</span></div>
        <div class="detail-row"><span class="label">Episode:</span><span class="value" id="funEpisode">—</span></div>
        <div class="detail-row"><span class="label">Context:</span><span class="value" id="funContext">—</span></div>
      </div>
    </div>
    <div class="action-row">
      <button class="action-btn" id="funNewBtn">✨ New</button>
      <button class="action-btn reveal" id="funRevealBtn">🔍 Reveal Answer</button>
    </div>
    <div class="quit-area">
      <button class="quit-btn" id="funQuitBtn">✖ Quit Game</button>
    </div>
  </div>

  <!-- COMPETITIVE MODE UI -->
  <div id="compModePanel" class="hidden">
    <div class="competitive-controls">
      <button class="action-btn" id="compNewQuestionBtn" style="flex:0 1 auto; padding: 6px 18px;">Next Q</button>
    </div>

    <div style="text-align: center;">
      <span id="questionCounter" class="question-counter">Question 0 / 0</span>
    </div>

    <div class="question-box" id="compQuestionBox">
      <div class="quote-display" id="compQuote">—</div>
      <div id="compAnswer" class="answer-details hidden">
        <div class="detail-row"><span class="label">Show:</span><span class="value" id="compShow">—</span></div>
        <div class="detail-row"><span class="label">Character:</span><span class="value" id="compCharacter">—</span></div>
        <div class="detail-row"><span class="label">Episode:</span><span class="value" id="compEpisode">—</span></div>
        <div class="detail-row"><span class="label">Context:</span><span class="value" id="compContext">—</span></div>
      </div>
    </div>

    <div class="action-row">
      <button class="action-btn reveal" id="compRevealBtn">🔍 Reveal Answer</button>
    </div>

    <!-- scoring: mark who was correct -->
    <div style="margin: 16px 0 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;">
      <span style="font-weight: 500;">✅ Who got it right?</span>
      <div id="correctMarkers" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
    </div>
    <div id="scoringStatus" class="scoring-disabled-note"></div>

    <div id="scoreDisplay" class="score-area"></div>
    <div id="compGameOver" class="win-message hidden"></div>
    <div class="quit-area">
      <button class="quit-btn" id="compQuitBtn">✖ Quit Game</button>
    </div>
  </div>

  <div class="footer-note">quotes loaded: <span id="quoteCount">0</span></div>
</div>

<script>
  (function() {

    const scoringStatus = document.getElementById('scoringStatus');
    const roundSelector = document.getElementById('roundSelector');
    const compQuitBtn = document.getElementById('compQuitBtn');

    // ---------- helper functions ----------
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getEnabledQuotes() {
      const enabledList = [];
      for (const [show, quotes] of Object.entries(QUOTES)) {
        if (enabledShows[show]) {
          enabledList.push(...quotes);
        }
      }
      return enabledList;
    }

    function getRandomQuote() {
      const enabled = getEnabledQuotes();
      if (enabled.length === 0) {
        alert('No shows enabled! Please enable at least one show.');
        return null;
      }
      return enabled[Math.floor(Math.random() * enabled.length)];
    }

    function renderQuote(q, quoteEl, answerEl, showEl, charEl, epEl, ctxEl) {
      if (!q) {
        quoteEl.textContent = 'No quotes available. Enable a show!';
        answerEl.classList.add('hidden');
        return;
      }
      quoteEl.textContent = `"${q.quote}"`;
      showEl.textContent = q.show || '—';
      charEl.textContent = q.character || '—';
      epEl.textContent = q.episode || '—';
      ctxEl.textContent = q.context || '—';
      answerEl.classList.add('hidden');
    }

    function handleReveal(answerEl) {
      if (!currentQuote) return;
      answerEl.classList.remove('hidden');
    }

    // ---------- Show Toggles ----------
    function renderShowToggles() {
      showToggleGroup.innerHTML = '';
      showNames.forEach(show => {
        const label = document.createElement('label');
        label.className = 'show-toggle';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = enabledShows[show] !== false;
        checkbox.dataset.show = show;
        checkbox.addEventListener('change', function() {
          enabledShows[this.dataset.show] = this.checked;
          updateQuoteCount();
        });
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(show));
        showToggleGroup.appendChild(label);
      });
      updateQuoteCount();
    }

    function updateQuoteCount() {
      const count = getEnabledQuotes().length;
      quoteCountSpan.textContent = count;
    }

    // ---------- update players UI ----------
    function renderPlayers() {
      playersContainer.innerHTML = '';
      if (players.length === 0) {
        const empty = document.createElement('span');
        empty.textContent = '👤 Add players';
        empty.style.color = '#b8b09a';
        empty.style.fontSize = '0.9rem';
        playersContainer.appendChild(empty);
        return;
      }
      players.forEach(name => {
        const tag = document.createElement('span');
        tag.className = 'player-tag';
        tag.innerHTML = `${name} <button class="remove-btn" data-name="${name}">✕</button>`;
        playersContainer.appendChild(tag);
      });
      document.querySelectorAll('.player-tag .remove-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const name = e.target.dataset.name;
          removePlayer(name);
        });
      });
      updateScoreDisplay();
    }

    function addPlayer(name) {
      const trimmed = name.trim();
      if (!trimmed) return false;
      if (players.includes(trimmed)) return false;
      players.push(trimmed);
      scores[trimmed] = 0;
      scoredThisQuestion[trimmed] = false;
      renderPlayers();
      updateScoreDisplay();
      return true;
    }

    function removePlayer(name) {
      players = players.filter(p => p !== name);
      delete scores[name];
      delete scoredThisQuestion[name];
      renderPlayers();
      updateScoreDisplay();
    }

    // ---------- scoring / competitive ----------
    function updateScoreDisplay() {
      scoreDisplay.innerHTML = '';
      if (players.length === 0) {
        scoreDisplay.innerHTML = '<span style="color:#b8b09a;">Add players to track scores</span>';
        return;
      }
      players.forEach(name => {
        const badge = document.createElement('span');
        badge.className = 'score-badge';
        badge.innerHTML = `${name} <span>${scores[name] || 0}</span>`;
        scoreDisplay.appendChild(badge);
      });
    }

    function renderCorrectMarkers() {
      correctMarkers.innerHTML = '';
      if (players.length === 0) {
        correctMarkers.innerHTML = '<span style="color:#b8b09a;font-size:0.9rem;">No players</span>';
        return;
      }
      players.forEach(name => {
        const btn = document.createElement('button');
        btn.textContent = name;
        btn.className = 'score-btn';
        btn.dataset.player = name;
        btn.style.background = '#2b4f3a';
        btn.style.border = '1px solid #5a7a4b';
        btn.style.color = '#f3e9d2';
        btn.style.padding = '6px 14px';
        btn.style.borderRadius = '40px';
        btn.style.fontSize = '0.8rem';
        btn.style.cursor = 'pointer';
        btn.style.transition = 'all 0.1s';
        btn.addEventListener('click', () => {
          if (gameOver || !gameStarted || currentMode !== 'competitive') return;
          if (currentQuote === null) {
            alert('No quote loaded!');
            return;
          }
          if (scoredThisQuestion[name]) {
            alert(`${name} already got a point for this question!`);
            return;
          }
          if (scores[name] !== undefined) {
            scores[name] = (scores[name] || 0) + 1;
            scoredThisQuestion[name] = true;
            updateScoreDisplay();
            updateScoringUI();
            btn.style.background = '#4a6e3b';
            btn.style.borderColor = '#7c9a6b';
            btn.disabled = true;
          }
        });
        correctMarkers.appendChild(btn);
      });
      updateScoringUI();
    }

    function updateScoringUI() {
      document.querySelectorAll('.score-btn').forEach(btn => {
        const name = btn.dataset.player;
        if (scoredThisQuestion[name]) {
          btn.style.background = '#4a6e3b';
          btn.style.borderColor = '#7c9a6b';
          btn.disabled = true;
        } else if (currentQuote && !document.getElementById('compAnswer').classList.contains('hidden')) {
          btn.style.background = '#2b4f3a';
          btn.style.borderColor = '#5a7a4b';
          btn.disabled = false;
        } else {
          btn.style.background = '#2b4f3a';
          btn.style.borderColor = '#5a7a4b';
          btn.disabled = true;
        }
      });

      const answerVisible = !document.getElementById('compAnswer').classList.contains('hidden');
      if (!answerVisible) {
        scoringStatus.textContent = '🔒 Reveal the answer to enable scoring';
      } else {
        const scored = Object.values(scoredThisQuestion).filter(v => v === true).length;
        const total = players.length;
        if (scored === total && total > 0) {
          scoringStatus.textContent = '✅ All players have scored for this question!';
        } else {
          scoringStatus.textContent = `📝 Click player names to award points (${scored}/${total} scored)`;
        }
      }
    }

    function compNewQuestion() {
      if (!gameStarted) {
        alert('Start the game first!');
        return;
      }
      if (gameOver) {
        resetCompetitiveGame();
        return;
      }
      if (players.length === 0) {
        alert('Add at least one player for competitive mode.');
        return;
      }
      if (roundLimit !== 0 && currentRound >= roundLimit) {
        gameOver = true;
        compGameOver.classList.remove('hidden');
        compGameOver.textContent = `🏁 Game Over! ${roundLimit} questions completed.`;
        compNewQuestionBtn.textContent = '🔄 New Game';
        updateQuestionCounter();
        scoringStatus.textContent = '⏹️ Game over!';
        return;
      }

      // Reset scoring tracking for new question
      players.forEach(name => {
        scoredThisQuestion[name] = false;
      });

      const q = getRandomQuote();
      if (!q) {
        alert('No enabled shows with quotes! Please enable at least one show.');
        return;
      }
      currentQuote = q;
      currentRound++;
      renderQuote(q, compQuote, compAnswer, compShow, compCharacter, compEpisode, compContext);
      compGameOver.classList.add('hidden');
      renderCorrectMarkers();
      updateScoreDisplay();
      updateQuestionCounter();
      scoringStatus.textContent = '🔒 Reveal the answer to enable scoring';
    }

    function resetCompetitiveGame() {
      currentRound = 0;
      gameOver = false;
      compGameOver.classList.add('hidden');
      compNewQuestionBtn.textContent = 'Next Q';
      players.forEach(name => { 
        scores[name] = 0;
        scoredThisQuestion[name] = false;
      });
      updateScoreDisplay();
      updateQuestionCounter();
      scoringStatus.textContent = '🔒 Reveal the answer to enable scoring';
      if (gameStarted) {
        compNewQuestion();
      }
    }

    function updateQuestionCounter() {
      const total = roundLimit === 0 ? '∞' : roundLimit;
      questionCounter.textContent = `Question ${currentRound} / ${total}`;
    }

    // ---------- Quit game ----------
    function quitGame() {
      if (!gameStarted) return;
      if (!confirm('Are you sure you want to quit the game? Progress will be lost.')) return;
      resetGameState();
      configPanel.classList.remove('hidden');
      configPanel2.classList.remove('hidden');
      startArea.classList.remove('hidden');
      funPanel.classList.add('hidden');
      compPanel.classList.add('hidden');
      players.forEach(name => {
        scores[name] = 0;
        scoredThisQuestion[name] = false;
      });
      updateScoreDisplay();
      updateQuestionCounter();
      compGameOver.classList.add('hidden');
      compNewQuestionBtn.textContent = 'Next Q';
      document.querySelectorAll('#roundSelector button').forEach(btn => {
        btn.disabled = false;
      });
      startBtn.disabled = false;
      startBtn.textContent = '▶ Start Game';
      gameStarted = false;
      currentQuote = null;
    }

    // ---------- start game ----------
    function startGame() {
      const enabled = getEnabledQuotes();
      if (enabled.length === 0) {
        alert('Please enable at least one show with quotes!');
        return;
      }
      if (currentMode === 'competitive' && players.length === 0) {
        alert('Please add at least one player for Competitive mode.');
        return;
      }
      gameStarted = true;
      startBtn.disabled = true;
      startBtn.textContent = '⏳ Game in progress';

      configPanel.classList.add('hidden');
      configPanel2.classList.add('hidden');
      startArea.classList.add('hidden');

      document.querySelectorAll('#roundSelector button').forEach(btn => {
        btn.disabled = true;
      });

      if (currentMode === 'fun') {
        funPanel.classList.remove('hidden');
        compPanel.classList.add('hidden');
        generateFunQuestion();
        scoringStatus.textContent = '';
      } else {
        funPanel.classList.add('hidden');
        compPanel.classList.remove('hidden');
        currentRound = 0;
        gameOver = false;
        players.forEach(name => { 
          scores[name] = 0;
          scoredThisQuestion[name] = false;
        });
        updateScoreDisplay();
        updateQuestionCounter();
        compGameOver.classList.add('hidden');
        compNewQuestionBtn.textContent = 'Next Q';
        compNewQuestion();
      }
    }

    // ---------- switch mode ----------
    function setMode(mode) {
      if (gameStarted) {
        if (!confirm('Changing mode will reset the game. Continue?')) return;
        resetGameState();
      }
      currentMode = mode;
      if (mode === 'fun') {
        funPanel.classList.add('hidden');
        compPanel.classList.add('hidden');
        funModeBtn.classList.add('active');
        compModeBtn.classList.remove('active');
        startBtn.disabled = false;
        startBtn.textContent = '▶ Start Game';
        gameStarted = false;
        scoringStatus.textContent = '';
        configPanel.classList.remove('hidden');
        configPanel2.classList.remove('hidden');
        startArea.classList.remove('hidden');
        document.querySelectorAll('#roundSelector button').forEach(btn => {
          btn.disabled = false;
        });
      } else {
        funPanel.classList.add('hidden');
        compPanel.classList.add('hidden');
        compModeBtn.classList.add('active');
        funModeBtn.classList.remove('active');
        startBtn.disabled = false;
        startBtn.textContent = '▶ Start Game';
        gameStarted = false;
        currentRound = 0;
        gameOver = false;
        players.forEach(name => { 
          scores[name] = 0;
          scoredThisQuestion[name] = false;
        });
        updateScoreDisplay();
        updateQuestionCounter();
        compGameOver.classList.add('hidden');
        compNewQuestionBtn.textContent = 'Next Q';
        scoringStatus.textContent = '🔒 Reveal the answer to enable scoring';
        configPanel.classList.remove('hidden');
        configPanel2.classList.remove('hidden');
        startArea.classList.remove('hidden');
        document.querySelectorAll('#roundSelector button').forEach(btn => {
          btn.disabled = false;
        });
      }
    }

    function resetGameState() {
      gameStarted = false;
      startBtn.disabled = false;
      startBtn.textContent = '▶ Start Game';
      gameOver = false;
      currentRound = 0;
      players.forEach(name => { 
        scores[name] = 0;
        scoredThisQuestion[name] = false;
      });
      updateScoreDisplay();
      compGameOver.classList.add('hidden');
      compNewQuestionBtn.textContent = 'Next Q';
      updateQuestionCounter();
      scoringStatus.textContent = '';
      configPanel.classList.remove('hidden');
      configPanel2.classList.remove('hidden');
      startArea.classList.remove('hidden');
      document.querySelectorAll('#roundSelector button').forEach(btn => {
        btn.disabled = false;
      });
    }

    function generateFunQuestion() {
      if (!gameStarted) return;
      const q = getRandomQuote();
      if (!q) {
        alert('No enabled shows with quotes! Please enable at least one show.');
        return;
      }
      currentQuote = q;
      renderQuote(q, funQuote, funAnswer, funShow, funCharacter, funEpisode, funContext);
    }

    // ---------- event binding ----------
    function init() {
      // Initialize enabled shows
      showNames.forEach(show => {
        enabledShows[show] = true;
      });
      renderShowToggles();

      funModeBtn.addEventListener('click', () => setMode('fun'));
      compModeBtn.addEventListener('click', () => setMode('competitive'));

      startBtn.addEventListener('click', startGame);

      funQuitBtn.addEventListener('click', quitGame);
      compQuitBtn.addEventListener('click', quitGame);

      addPlayerBtn.addEventListener('click', () => {
        const name = playerNameInput.value.trim();
        if (addPlayer(name)) {
          playerNameInput.value = '';
          if (currentMode === 'competitive') {
            renderCorrectMarkers();
            updateScoreDisplay();
          }
        } else {
          alert('Invalid or duplicate name.');
        }
      });
      playerNameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') addPlayerBtn.click();
      });

      funRevealBtn.addEventListener('click', function() {
        if (!gameStarted) { alert('Start the game first!'); return; }
        if (!currentQuote) return;
        handleReveal(funAnswer);
      });
      funNewBtn.addEventListener('click', generateFunQuestion);

      compRevealBtn.addEventListener('click', function() {
        if (!gameStarted) { alert('Start the game first!'); return; }
        if (!currentQuote) return;
        handleReveal(compAnswer);
        updateScoringUI();
      });

      compNewQuestionBtn.addEventListener('click', compNewQuestion);

      document.querySelectorAll('#roundSelector button').forEach(btn => {
        btn.addEventListener('click', function() {
          if (gameStarted) {
            if (!confirm('Changing round limit will reset the game. Continue?')) return;
            resetGameState();
          }
          document.querySelectorAll('#roundSelector button').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          const val = parseInt(this.dataset.round, 10);
          roundLimit = val;
          if (currentMode === 'competitive') {
            updateQuestionCounter();
            scoringStatus.textContent = '🔒 Reveal the answer to enable scoring';
          }
        });
      });

      renderPlayers();
      setMode('fun');
    }

    init();
  })();
</script>
</body>
</html>
